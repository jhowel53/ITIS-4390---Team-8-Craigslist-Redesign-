<header class="header">
    <div class="header_top">

        <div class="header_top_left">

            <button
                class="mobile-search-toggle"
                type="button"
                aria-label="Open search"
                aria-expanded="false"
                aria-controls="searchInput"
            >
                <img src="../Images/Icons/search.svg" alt="">
            </button>

            <div class="logo">
                <a href="#" onclick="switchPage('home')">
                    <img src="../Images/Icons/logo.svg" alt="Home">
                </a>
            </div>

            <!-- Location Selector -->
            <div class="location-select-wrap">
                <img src="../Images/Icons/location.svg" alt="">

                <select id="locationSelect" aria-label="Select location">
                    <option>SF Bay Area</option>
                    <option>New York</option>
                    <option>Seattle</option>
                    <option>Austin</option>
                    <option>Chicago</option>
                </select>
            </div>

            <!-- Light / Dark Mode Toggle -->
            <div class="theme_toggle">

                <span
                    class="theme_status"
                    id="themeStatus"
                    aria-live="polite"
                >
                    Light
                </span>

                <input
                    type="checkbox"
                    id="check"
                    aria-label="Light mode on. Switch to dark mode"
                >

                <label
                    for="check"
                    class="toggle_button"
                    title="Switch to dark mode"
                ></label>

            </div>

        </div>


        <!-- Search Bar -->
        <form
            class="search_bar"
            onsubmit="event.preventDefault(); triggerSearch();"
        >

            <input
                type="search"
                id="searchInput"
                placeholder="Search..."
                oninput="triggerSearch()"
                aria-label="Search page content"
                aria-controls="searchSuggestions"
                aria-expanded="false"
                autocomplete="off"
            >

            <button type="submit" aria-label="Search">
                <img src="../Images/Icons/search.svg" alt="">
            </button>

            <button
                class="search-close-button"
                type="button"
                aria-label="Close search"
            >
                <span aria-hidden="true">&times;</span>
            </button>

            <ul
                class="search_suggestions"
                id="searchSuggestions"
                role="list"
                aria-label="Search suggestions"
                aria-live="polite"
                hidden
            ></ul>

        </form>


        <div class="header_top_right">

            <a class="account-link" href="signup.html">
                <img
                    src="../Images/Icons/person_24dp_1F1F1F_FILL1_wght400_GRAD0_opsz24.svg"
                    alt=""
                >
                <span>Sign Up / Login</span>
            </a>

            <a class="saved-posts-link" href="cart.html">
                Saved Posts
            </a>

            <button
                class="sidebar_button"
                aria-expanded="false"
                aria-controls="sidebar"
                aria-label="Open navigation"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

    </div>


    <nav class="header_nav_bottom" id="sidebar">

        <a href="hiring.html">
            Hire
        </a>

        <a href="search.html">
            Items
        </a>

        <a href="discussions.html">
            Discussion Forum
        </a>

        <a class="mobile-saved-posts-link" href="cart.html">
            Saved Posts
        </a>

        <a class="mobile-settings-link" href="setting.html">
            Settings
        </a>

    </nav>

</header>
